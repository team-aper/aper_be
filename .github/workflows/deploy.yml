name: Deploy to EC2 using Docker and ECR

on:
  push:
    branches:
      - dev
      - feature/mono-repo
  pull_request:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create application-secret.yml from secret
        run: |
          mkdir -p ./src/main/resources/yml
          echo "${{ secrets.APPLICATION_SECRET_YML }}" > ./src/main/resources/yml/application-secret.yml

      # Gradle 빌드 할 때, 이미 저장한 데이터를 캐싱하여 빌드시 이를 사용하도록함.
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin ${{ secrets.ECR_URI }}

      - name: Build Docker image
        run: docker build -t aper-be .

      - name: Tag Docker image
        run: docker tag aper-be:latest ${{ secrets.ECR_URI }}:latest

      - name: Push Docker image to ECR
        run: docker push ${{ secrets.ECR_URI }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-2 | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_URI }}

            sudo docker pull ${{ secrets.ECR_URI }}:latest

            # Redis 컨테이너 확인 및 시작
            if sudo docker ps -a --format '{{.Names}}' | grep -q '^redis_container$'; then
              echo "Redis 컨테이너가 이미 존재합니다. 재시작합니다."
              sudo docker start redis_container || true
            else
              echo "Redis 컨테이너를 새로 생성합니다."
              sudo docker run -d \
                --name redis_container \
                --restart unless-stopped \
                -p 6379:6379 \
                -v redis_data:/data \
                redis:7-alpine redis-server --requirepass ${{ secrets.REDIS_PASSWORD }} --appendonly yes
            fi

            sudo docker stop aper-be || true
            sudo docker rm aper-be || true

            sudo docker run -d \
              --name aper-be \
              -p 8080:8080 \
              --restart unless-stopped \
              --link redis_container:redis_container \
              -e SPRING_PROFILES_ACTIVE=dev \
              ${{ secrets.ECR_URI }}:latest

            sudo docker image prune -af --filter "label!=keep"

            sleep 10
            for i in {1..10}; do
              if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ 배포 성공! 애플리케이션이 정상 구동 중입니다."
                exit 0
              fi
              echo "⏳ 애플리케이션 시작 대기 중... ($i/10)"
              sleep 5
            done
            echo "❌ 헬스체크 실패. 로그를 확인하세요: sudo docker logs aper-be"
            exit 1